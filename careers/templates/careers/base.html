{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}CareerCompass{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script>(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('cc-theme')||'dark'); })();</script>
  <style>
    /* ── TOKENS ── */
    :root {
      --font: 'Inter', sans-serif;
      --radius: 14px;
      --radius-sm: 8px;
      --radius-pill: 999px;
      --transition: .2s ease;
    }
    [data-theme="dark"] {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #222536;
      --border: rgba(255,255,255,.08);
      --border-accent: rgba(99,102,241,.35);
      --text: #f1f5f9;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --primary: #6366f1;
      --primary-soft: rgba(99,102,241,.12);
      --accent: #22d3ee;
      --accent-soft: rgba(34,211,238,.12);
      --green: #34d399;
      --green-soft: rgba(52,211,153,.12);
      --red: #f87171;
      --red-soft: rgba(248,113,113,.12);
      --yellow: #fbbf24;
      --yellow-soft: rgba(251,191,36,.12);
      --shadow: 0 4px 24px rgba(0,0,0,.4);
      --shadow-sm: 0 2px 8px rgba(0,0,0,.3);
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --border: rgba(0,0,0,.08);
      --border-accent: rgba(99,102,241,.2);
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --primary: #4f46e5;
      --primary-soft: rgba(79,70,229,.08);
      --accent: #0891b2;
      --accent-soft: rgba(8,145,178,.08);
      --green: #059669;
      --green-soft: rgba(5,150,105,.08);
      --red: #dc2626;
      --red-soft: rgba(220,38,38,.08);
      --yellow: #d97706;
      --yellow-soft: rgba(217,119,6,.08);
      --shadow: 0 4px 24px rgba(0,0,0,.08);
      --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
    }

    /* ── RESET ── */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; line-height:1.6; transition:background var(--transition), color var(--transition); }
    a { text-decoration:none; color:inherit; }
    button { font-family:inherit; cursor:pointer; border:none; outline:none; }
    input, select, textarea { font-family:inherit; outline:none; }

    /* ── NAV ── */
    .nav {
      background:var(--surface);
      border-bottom:1px solid var(--border);
      padding:0 24px;
      height:60px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      position:sticky;
      top:0;
      z-index:100;
      box-shadow:var(--shadow-sm);
    }
    .nav-logo {
      font-size:1.2rem;
      font-weight:800;
      color:var(--primary);
      display:flex;
      align-items:center;
      gap:8px;
    }
    .nav-logo em { color:var(--accent); font-style:normal; }
    .nav-links {
      display:flex;
      align-items:center;
      gap:4px;
    }
    .nav-links a {
      padding:6px 14px;
      border-radius:var(--radius-pill);
      font-size:.875rem;
      font-weight:500;
      color:var(--text-2);
      transition:all var(--transition);
    }
    .nav-links a:hover { color:var(--text); background:var(--surface2); }
    .nav-links a.active { color:var(--primary); background:var(--primary-soft); }
    .nav-right { display:flex; align-items:center; gap:10px; }
    .theme-btn {
      width:36px; height:36px;
      border-radius:50%;
      background:var(--surface2);
      border:1px solid var(--border);
      font-size:1rem;
      display:flex; align-items:center; justify-content:center;
      transition:all var(--transition);
      color:var(--text);
    }
    .theme-btn:hover { border-color:var(--primary); transform:scale(1.05); }

    /* ── LAYOUT ── */
    .container { max-width:1080px; margin:0 auto; padding:0 20px; }
    .page-wrap { padding:40px 0 80px; }

    /* ── BUTTONS ── */
    .btn-primary {
      background:var(--primary);
      color:#fff;
      padding:10px 22px;
      border-radius:var(--radius-pill);
      font-size:.875rem;
      font-weight:600;
      transition:all var(--transition);
      display:inline-flex; align-items:center; gap:6px;
    }
    .btn-primary:hover { opacity:.9; transform:translateY(-1px); box-shadow:0 4px 16px rgba(99,102,241,.35); }
    .btn-outline {
      background:transparent;
      color:var(--primary);
      border:1.5px solid var(--primary);
      padding:10px 22px;
      border-radius:var(--radius-pill);
      font-size:.875rem;
      font-weight:600;
      transition:all var(--transition);
      display:inline-flex; align-items:center; gap:6px;
    }
    .btn-outline:hover { background:var(--primary); color:#fff; }
    .btn-ghost {
      background:var(--surface2);
      color:var(--text-2);
      padding:10px 22px;
      border-radius:var(--radius-pill);
      font-size:.875rem;
      font-weight:500;
      border:1px solid var(--border);
      transition:all var(--transition);
      display:inline-flex; align-items:center; gap:6px;
    }
    .btn-ghost:hover { color:var(--text); border-color:var(--primary); }

    /* ── CARDS ── */
    .card {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:24px;
      transition:border-color var(--transition), background var(--transition);
    }
    .card:hover { border-color:var(--border-accent); }

    /* ── TAGS ── */
    .tag { padding:4px 12px; border-radius:var(--radius-pill); font-size:.78rem; font-weight:600; display:inline-block; }
    .tag-green { background:var(--green-soft); color:var(--green); }
    .tag-red   { background:var(--red-soft);   color:var(--red);   }
    .tag-blue  { background:var(--accent-soft); color:var(--accent); }
    .tag-purple{ background:var(--primary-soft);color:var(--primary); }
    .tag-yellow{ background:var(--yellow-soft); color:var(--yellow); }

    /* ── FORM INPUTS ── */
    .field-input {
      width:100%;
      padding:10px 14px;
      background:var(--surface2);
      border:1.5px solid var(--border);
      border-radius:var(--radius-sm);
      color:var(--text);
      font-size:.9rem;
      transition:border-color var(--transition), background var(--transition);
    }
    .field-input:focus { border-color:var(--primary); background:var(--surface); }
    select.field-input option { background:var(--surface); color:var(--text); }
    .field-label { font-size:.8rem; font-weight:600; color:var(--text-2); margin-bottom:6px; display:block; text-transform:uppercase; letter-spacing:.4px; }

    /* ── CHIP ── */
    .chip {
      padding:6px 14px;
      border-radius:var(--radius-pill);
      font-size:.8rem;
      font-weight:500;
      border:1.5px solid var(--border);
      cursor:pointer;
      background:transparent;
      color:var(--text-2);
      transition:all var(--transition);
      user-select:none;
    }
    .chip:hover { border-color:var(--primary); color:var(--primary); }
    .chip.on, .chip.active { background:var(--primary-soft); border-color:var(--primary); color:var(--primary); font-weight:600; }

    /* ── PAGE TITLE ── */
    .page-title { font-size:1.6rem; font-weight:800; margin-bottom:4px; }
    .page-sub   { font-size:.9rem; color:var(--text-2); }

    /* ── SECTION HEADING ── */
    .section-heading { font-size:1rem; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.6px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
    .section-heading::after { content:''; flex:1; height:1px; background:var(--border); }

    /* ── EMPTY STATE ── */
    .empty-state { text-align:center; padding:64px 20px; color:var(--text-2); }
    .empty-state .es-icon { font-size:3rem; margin-bottom:16px; }
    .empty-state h3 { font-size:1.2rem; font-weight:700; color:var(--text); margin-bottom:8px; }
    .empty-state p { font-size:.9rem; margin-bottom:24px; }

    /* ── STEPS NAV (form) ── */
    .steps-nav { display:flex; gap:6px; }
    .step-pill { padding:5px 14px; border-radius:var(--radius-pill); font-size:.78rem; font-weight:600; background:var(--surface2); color:var(--text-3); border:1px solid var(--border); }
    .step-pill.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .step-pill.done   { background:var(--green-soft); color:var(--green); border-color:var(--green); }

    /* ── RESPONSIVE ── */
    @media(max-width:768px) {
      .nav { padding:0 16px; }
      .nav-links { display:none; }
      .page-wrap { padding:24px 0 60px; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="nav">
  <a href="{% url 'home' %}" class="nav-logo">🧭 Career<em>Compass</em></a>

  <div class="nav-links">
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'profile_form' %}">Analyse</a>
    <a href="{% url 'careers_list' %}">Careers</a>
    <a href="{% url 'history' %}">History</a>
    <a href="{% url 'skill_roadmap' %}">Roadmap</a>
  </div>

  <div class="nav-right">
    {% block nav_steps %}{% endblock %}
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme" id="themeBtn">☀️</button>
  </div>
</nav>

{% block content %}{% endblock %}

<script>
function toggleTheme(){
  const html = document.documentElement;
  const t = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', t);
  localStorage.setItem('cc-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}
(function(){
  const t = localStorage.getItem('cc-theme') || 'dark';
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
})();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
