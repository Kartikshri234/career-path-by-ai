{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}CareerCompass{% endblock %}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Chart.js (results page radar/bar + screener chart) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" defer></script>

  <!-- Theme flash prevention -->
  <script>(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('cc-theme') || 'light'); })();</script>

  <!-- Global stylesheet -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">

  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- ── NAVIGATION ── -->
<nav class="nav">
  <div class="nav-inner">
    <a href="{% url 'home' %}" class="nav-logo">
      <div class="nav-logo-icon">🧭</div>
      Career<span>Compass</span>
    </a>

    <!-- Hamburger (mobile only) -->
    <button class="nav-hamburger" id="navHamburger" aria-label="Open menu" onclick="toggleMobileNav()">
      <span></span><span></span><span></span>
    </button>

    <div class="nav-links" id="navLinks">
      <a href="{% url 'home' %}"             class="nav-link">Home</a>
      <a href="{% url 'profile_form' %}"     class="nav-link">Analyse</a>
      <a href="{% url 'careers_list' %}"     class="nav-link">Careers</a>
      <a href="{% url 'skill_roadmap' %}"    class="nav-link">Roadmap</a>
      <a href="{% url 'screener' %}"         class="nav-link">Resume</a>
      <a href="{% url 'history' %}"          class="nav-link">History</a>
    </div>

    <div class="nav-right">
      <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme" id="themeBtn">☀️</button>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<!-- Global JS -->
<script src="{% static 'js/main.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
